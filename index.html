)<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c1f26">
  <title>My Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="calculator">

    <!-- Display -->
    <div class="display">
      <div id="history"></div>
      <div id="display">0</div>
    </div>

    <!-- Calculator Buttons -->
    <div class="buttons">

      <!-- Row 1 -->
      <button class="function" onclick="clearDisplay()">AC</button>
      <button class="function" onclick="deleteLast()">DEL</button>
      <button class="function" onclick="percentage()">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <!-- Row 2 -->
      <button class="function" onclick="appendParenthesis('(')">(</button>
      <button class="function" onclick="appendParenthesis(')')">)</button>
      <button class="function" onclick="squareRoot()">√</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <!-- Row 3 -->
      <button class="function" onclick="square()">x²</button>
      <button class="function" onclick="toggleSign()">±</button>
      <button class="function" onclick="appendConstant('pi')">π</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <!-- Row 4 -->
      <button class="scientific" onclick="scientificFunction('sin')">sin</button>
      <button class="scientific" onclick="scientificFunction('cos')">cos</button>
      <button class="scientific" onclick="scientificFunction('tan')">tan</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <!-- Row 5 -->
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <!-- Row 6 -->
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <!-- Row 7 -->
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <!-- Row 8 -->
      <button onclick="appendNumber('0')" class="zero">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>

    </div>

    <!-- History -->
    <div class="history-panel">
      <div class="history-title">
        <span>Calculation History</span>
        <button onclick="clearHistory()">Clear</button>
      </div>

      <div id="historyList">
        <p class="empty-history">No calculations yet</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
